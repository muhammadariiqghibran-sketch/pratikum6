    <title>Document</title>

  <body>
    <script>
      let tugas = 80;
      let uts = 70;
      let uas = 90;
      const nama = "Ariiq";

      const nilai_akhir = tugas * 0.3 + uts * 0.3 + uas * 0.4;

      if (nilai_akhir >= 60) {
        console.log("Nama:", nama, "Nilai akhir:", nilai_akhir, "LULUS");
      } else {
        console.log("Nama:", nama, "Nilai akhir:", nilai_akhir, "TIDAK LULUS");
      }
    </script>
  </body>
